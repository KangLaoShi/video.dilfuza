        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 拼音汉字注音样式 (Ruby) */
        ruby { ruby-align: center; }
        rt { font-size: 0.75rem; color: #6b7280; user-select: none; }
    </style>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- 顶部简易导航 -->

        <div class="max-w-5xl w-full mx-auto px-4 flex justify-between items-center">

            </a>
            <button class="text-sm font-medium text-gray-500 hover:text-gray-900">返回课程列表</button>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- 左侧/上方：视频播放器区域 -->
        <div class="w-full lg:w-3/5 flex flex-col gap-4">
            <div class="bg-black rounded-xl overflow-hidden shadow-lg aspect-video relative">
                <!-- 添加占位提示：当沙盒拦截视频时，能给用户明确的反馈 -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 p-6 text-center z-0">
                    <p class="text-sm mb-1">正在加载 YouTube 播放器...</p>
                    <p class="text-xs opacity-75">如果一直黑屏，说明当前的预览沙盒或您的浏览器插件拦截了该视频嵌入。</p>
                </div>
                
                <!-- 使用 youtube-nocookie.com 提高嵌入成功率，避免因跨站 Cookie 被拦截 -->
                <iframe id="youtube-player" class="absolute inset-0 w-full h-full z-10" 
                        src="https://www.youtube-nocookie.com/embed/5yfuRvd4Scg?enablejsapi=1&playsinline=1&rel=0" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
            </div>
            
            <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                <h1 class="text-2xl font-bold mb-2">如何在餐厅用中文点菜？</h1>
                <div class="flex items-center gap-4 text-sm text-gray-500">
                    <span class="bg-red-50 text-red-600 px-2 py-1 rounded font-medium">Beginner (初级)</span>
                    <span><i data-lucide="tag" class="w-4 h-4 inline mr-1"></i>Food (美食)</span>
                </div>
                <p class="mt-4 text-gray-600 text-sm leading-relaxed">
                    在这节课中，我们将学习中国餐厅里最常用的点菜句子。注意听康老师的发音，你可以点击右侧（或下方）的字幕来反复练习某一句！
                </p>
            </div>
        </div>

        <!-- 右侧/下方：交互式同步字幕区域 -->
        <div class="w-full lg:w-2/5 flex flex-col h-[600px]">
            <div class="bg-white rounded-t-xl p-4 border border-gray-100 border-b-0 flex justify-between items-center shadow-sm">
                <h2 class="font-bold flex items-center gap-2">
                    <i data-lucide="align-left" class="w-5 h-5 text-red-600"></i>
                    互动字幕 (Transcript)
                </h2>
                <!-- 控制拼音显示的开关 -->
                <label class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="toggle-pinyin" class="sr-only" checked>
                        <div class="block bg-gray-200 w-10 h-6 rounded-full transition-colors toggle-bg"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                    </div>
                    <span class="ml-2 text-sm font-medium text-gray-600">显示拼音</span>
                </label>
            </div>
            
            <!-- 滚动的字幕列表 -->
            <div id="transcript-container" class="bg-white border border-gray-100 rounded-b-xl shadow-sm flex-1 overflow-y-auto p-2 scroll-smooth">
                <!-- 字幕由 JavaScript 动态生成 -->
            </div>
        </div>
    </main>

    <div id="dictionary-tooltip" class="hidden fixed z-[100] bg-white rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.2)] border border-red-100 p-4 min-w-[160px] transform -translate-x-1/2 transition-opacity pointer-events-none">

        const container = document.getElementById('transcript-container');
        let transcriptElements = [];

        // 渲染字幕到页面
        function renderTranscript() {
            container.innerHTML = '';
            transcriptElements = [];

            transcriptData.forEach((item, index) => {
                const lineDiv = document.createElement('div');
                // 修改为 Flex 布局，左侧加上一个小的播放图标
                lineDiv.className = "flex gap-3 p-4 mb-2 rounded-lg cursor-pointer transition-all duration-200 hover:bg-red-50 border-l-4 border-transparent group";
                lineDiv.dataset.start = item.start;
                lineDiv.dataset.index = index;
                
                const playBtnHtml = `<div class="shrink-0 mt-2 text-gray-300 group-hover:text-red-500 transition-colors"><i data-lucide="play-circle" class="w-5 h-5"></i></div>`;
                
                let wordsHtml = '<div class="text-lg font-medium text-gray-800 leading-loose flex flex-wrap gap-x-1">';
                
                item.words.forEach(w => {
                    if (w.py) {
                        // 带有拼音和翻译的交互式词语
                        wordsHtml += `
                            <ruby class="dict-word relative hover:bg-red-100 hover:text-red-700 rounded px-1 transition-colors cursor-help" data-py="${w.py}" data-tr="${w.tr}">
                                ${w.text}
                                <rt class="pinyin-text text-sm text-gray-500 mb-1 pointer-events-none">${w.py}</rt>
                            </ruby>
                        `;
                    } else {
                        // 标点符号，不支持点击
                        wordsHtml += `<span class="py-1 text-gray-500">${w.text}</span>`;
                    }
                });
                
                wordsHtml += '</div>';
                lineDiv.innerHTML = playBtnHtml + wordsHtml;

                // 处理点击逻辑：分清是点词查字典，还是点句子跳进度
                lineDiv.addEventListener('click', (e) => {
                    // 如果点中的是具体的单词，就拦截跳转行为（在后面会触发字典气泡）
                    if (e.target.closest('.dict-word')) return;

                    // 否则（点中空白处或播放按钮），控制视频跳转
                    if (player && player.seekTo) {
                        player.seekTo(item.start, true);
                        player.playVideo();
                    }
                });

                container.appendChild(lineDiv);
                transcriptElements.push(lineDiv);
            });

            // 重新初始化图标
            lucide.createIcons();
            // 绑定词典交互事件
            bindDictionaryEvents();
        }

        // ==========================================
        // 词典交互逻辑 (弹窗)
        // ==========================================
        function bindDictionaryEvents() {
            const tooltip = document.getElementById('dictionary-tooltip');
            const pyEl = document.getElementById('tt-pinyin');
            const trEl = document.getElementById('tt-trans');

            document.querySelectorAll('.dict-word').forEach(word => {
                word.addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止事件冒泡
                    const py = e.currentTarget.dataset.py;
                    const tr = e.currentTarget.dataset.tr;

                    pyEl.textContent = py;
                    trEl.textContent = tr;

                    // 计算并设置弹窗位置（在单词正上方）
                    const rect = e.currentTarget.getBoundingClientRect();
                    tooltip.style.top = (rect.top + window.scrollY - tooltip.offsetHeight - 10) + 'px';
                    tooltip.style.left = (rect.left + (rect.width / 2)) + 'px';

                    tooltip.classList.remove('hidden');
                });
            });

            // 点击页面任意其他地方隐藏弹窗
            document.addEventListener('click', () => {
                if (tooltip) tooltip.classList.add('hidden');
            });

            // 滚动字幕框时也隐藏弹窗，避免卡片悬停错位
            container.addEventListener('scroll', () => {
                if (tooltip) tooltip.classList.add('hidden');
            });
        }

        // ==========================================
        // YouTube IFrame API 逻辑
        // ==========================================
        let player;
        let syncInterval;

        // 1. 加载 YouTube API 脚本
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        if (firstScriptTag) {
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        } else {
            document.head.appendChild(tag);
        }

        // 2. API 准备好后自动调用此函数 (绑定到全局确保被触发)
        window.onYouTubeIframeAPIReady = function() {
            // 直接绑定到页面上已存在的 iframe (id="youtube-player")
            player = new YT.Player('youtube-player', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        // 3. 监听播放器状态
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                // 视频播放时，每 0.5 秒检查一次时间并同步字幕
                syncInterval = setInterval(syncTranscript, 500);
            } else {
                // 暂停或结束时，停止同步
                clearInterval(syncInterval);
            }
        }

        // 4. 同步高亮当前字幕
        let currentIndex = -1;
        function syncTranscript() {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime();

            // 查找当前时间属于哪一句
            let activeIndex = -1;
            for (let i = 0; i < transcriptData.length; i++) {
                if (currentTime >= transcriptData[i].start && currentTime < transcriptData[i].end) {
                    activeIndex = i;
                    break;
                }
            }

            // 如果当前句子发生了变化，更新 UI
            if (activeIndex !== currentIndex && activeIndex !== -1) {
                // 清除之前的激活状态
                if (currentIndex !== -1) {
                    transcriptElements[currentIndex].classList.remove('bg-red-50', 'border-red-500');
                    transcriptElements[currentIndex].classList.add('border-transparent');
                }
                
                // 设置新的激活状态
                transcriptElements[activeIndex].classList.add('bg-red-50', 'border-red-500');
                transcriptElements[activeIndex].classList.remove('border-transparent');
                
                // 让滚轮自动滚动到高亮的那一句
                const activeEl = transcriptElements[activeIndex];
                container.scrollTo({
                    top: activeEl.offsetTop - container.offsetTop - 60,
                    behavior: 'smooth'
                });

                currentIndex = activeIndex;
            }
        }

        // ==========================================
        // 拼音开关逻辑
        // ==========================================
        const togglePinyin = document.getElementById('toggle-pinyin');
        
        togglePinyin.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            const dot = e.target.parentElement.querySelector('.dot');
            const bg = e.target.parentElement.querySelector('.toggle-bg');
            
            // 切换开关动画
            if(isChecked) {
                dot.classList.add('translate-x-4');
                bg.classList.add('bg-red-500');
                bg.classList.remove('bg-gray-200');
            } else {
                dot.classList.remove('translate-x-4');
                bg.classList.remove('bg-red-500');
                bg.classList.add('bg-gray-200');
            }

            // 隐藏/显示拼音文本
            const pinyinElements = document.querySelectorAll('.pinyin-text');
            pinyinElements.forEach(el => {
                el.style.display = isChecked ? 'block' : 'none';
            });
        });

        // 初始化
        renderTranscript();
        
        // 初始化 Toggle 样式
        const initDot = togglePinyin.parentElement.querySelector('.dot');
        const initBg = togglePinyin.parentElement.querySelector('.toggle-bg');
        initDot.classList.add('translate-x-4');
        initBg.classList.add('bg-red-500');
        initBg.classList.remove('bg-gray-200');

    </script>
